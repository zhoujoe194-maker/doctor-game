name: Agent 协作任务
description: 多窗口/多模型实现或独立审查任务单；先认领协调，再写代码
title: "[agent] "
body:
  - type: markdown
    attributes:
      value: |
        任务 Issue 是认领和交接入口，不是原子锁。先在评论提交 proposal，得到协调窗口确认一个 owner/范围后再写。不要用本模板替代 Issue 评论中的实时状态。
  - type: input
    id: owner
    attributes:
      label: 负责人 / 角色
      description: 模型或窗口、实现/审查/协调角色，以及唯一 owner
      placeholder: "例如：DSH / 实现窗口 / owner"
    validations:
      required: true
  - type: input
    id: base_sha
    attributes:
      label: 基线 SHA
      description: 必须来自 fetch 后的 origin/main 或协调窗口明确的 base
      placeholder: "git rev-parse origin/main"
    validations:
      required: true
  - type: input
    id: worktree_branch
    attributes:
      label: 独立目录与任务分支
      description: 独立 clone/worktree 路径（用仓库相对或通用说明，不写他人机器绝对路径）和 codex/<issue>-<scope>
      placeholder: "worktree: ../doctor-game-<issue>; branch: codex/<issue>-<scope>"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 目标、允许修改范围与共享文件
      description: 明确不做什么；列出允许文件/目录、共享热点、依赖或锁文件、需要协调的对象
      placeholder: "目标：…；允许写：src/...；共享热点：…；不改：…"
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 依赖与冲突检查
      description: 任务 Issue、其他窗口、端口/产物隔离、需要的工具或权限；没有写“无”
      placeholder: "依赖：…；冲突：…；独立端口：…；user-data：…"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收步骤与可观察结果
      description: 负责人将独立核对的步骤和证据，不只写“测试通过”
      placeholder: "1. …；2. …；期望证据：…"
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: 实际命令和结果
      description: 实现后填写；命令、退出码、通过/失败、未验证项、阻塞项
      placeholder: "npm test: …；npm run test:ui: …；Electron: …；未验证：…"
    validations:
      required: false
  - type: input
    id: delivery_sha
    attributes:
      label: 冻结交付 SHA
      description: 实现完成、不再改写后填写；协调窗口独立验收前不要声称已合并
      placeholder: "commit SHA"
    validations:
      required: false
  - type: textarea
    id: review
    attributes:
      label: 独立验收回执
      description: 协调/独立 review 窗口填写实际复测、退回项和最终状态；合并/发布另行按用户当前授权
      placeholder: "实际复核：…；退回：…；结论：…"
    validations:
      required: false
